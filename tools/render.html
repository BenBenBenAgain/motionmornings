<!doctype html><html><head><meta charset="utf-8"><title>Scene render (test tool)</title><meta name="robots" content="noindex"></head>
<body style="margin:0;background:#ddd"><div id=g style="display:flex;flex-wrap:wrap;gap:4px"></div>
<script>
// Test tool: renders scenes from ?s=[[key, t, p, look, [x, y, w, h]], ...] at scale ?k. ?engine= loads another engine file (for before/after).
const Q = new URLSearchParams(location.search);
const s = document.createElement('script');
s.src = Q.get('engine') || '../engine.js';
s.onload = () => {
  const spec = JSON.parse(Q.get('s') || '[]'), k = +(Q.get('k') || 0.3), g = document.getElementById('g');
  spec.forEach(([key, t, p, me, crop]) => {
    const c = document.createElement('canvas'); c.width = LSN.W; c.height = LSN.H;
    const cfg = { me: Object.assign({}, LSN.DEFAULT_ME, me || {}), pets: [], kids: [] };
    LSN.drawScene(c.getContext('2d'), cfg, key, t, p);
    const o = document.createElement('canvas'), [cx, cy, cw, ch] = crop || [0, 0, LSN.W, LSN.H];
    o.width = cw * k; o.height = ch * k; o.getContext('2d').drawImage(c, cx, cy, cw, ch, 0, 0, cw * k, ch * k); g.appendChild(o);
  });
};
document.body.appendChild(s);
</script></body></html>
